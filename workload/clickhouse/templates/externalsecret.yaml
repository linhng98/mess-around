apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: clickhouse-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.credentials.remoteKey | quote }}
        property: {{ .Values.credentials.remoteProperty | quote }}
