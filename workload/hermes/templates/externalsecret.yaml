apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: hermes-auth
    creationPolicy: Owner
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.credentials.remoteKey | quote }}
        property: openrouter_api_key
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: {{ .Values.credentials.remoteKey | quote }}
        property: discord_bot_token
