base:
  global:
    istioNamespace: istio-system
  base:
    validationFailurePolicy: Fail
istiod:
  base:
    validationFailurePolicy: Fail
gateway:
  name: istio-ingressgateway
  kind: DaemonSet
  autoscaling:
    enabled: false
  service:
    externalTrafficPolicy: Local
    loadBalancerIP: 192.168.1.200
